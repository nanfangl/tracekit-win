[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracekit-win"
version = "1.0.0"
description = "Windows software behaviour recorder: processes, files (read+write), registry, network, UI tree, clicks & responses, logs, clipboard, DLLs, system changes, kernel ETW - all from outside the target, no injection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TraceKit contributors" }]
keywords = ["windows", "monitoring", "etw", "reverse-engineering", "forensics", "gui-automation", "observability"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# 只有打包单文件 EXE 时才需要；运行与源码方式使用零依赖
build = ["pyinstaller>=6.0"]
# 截图录制用到 Pillow（ImageGrab）；没有它会自动跳过截图，其它功能不受影响
pictures = ["pillow>=9.0"]

[project.scripts]
tracekit = "tracekit.cli:main"

[project.gui-scripts]
tracekit-gui = "tracekit.gui:main"

[tool.setuptools]
packages = ["tracekit"]
