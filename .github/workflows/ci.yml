name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # en-US runner 的默认编码是 cp1252，中文输出/文件名会踩坑，统一强制 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONLEGACYWINDOWSSTDIO: "0"

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: README 引用的图片/链接必须存在（防止 GitHub 上 404）
        run: python tools/check_readme_images.py

      - name: 语法检查（全部模块）
        run: python -m compileall -q tracekit tools demo_victim.py TraceKit_main.py

      - name: 静态体检探针（PE/壳/易语言/导入表）
        run: python -m tracekit probe "$env:WINDIR\System32\notepad.exe"

      - name: 录一段无窗口的进程（进程/文件/注册表/日志）
        shell: pwsh
        run: |
          python -m tracekit run --name ci --profile light --no-etw --no-input --no-ui `
            --no-shot-on-focus --duration 12 --out ci-run --quiet `
            -- "$env:COMSPEC" /c "timeout /t 2 >nul & mkdir ci-data & echo hello > ci-data\a.txt & copy ci-data\a.txt ci-data\b.txt & reg add HKCU\Software\TraceKitCI /v ok /t REG_SZ /d 1 /f"

      - name: 断言确实抓到了事件并出了报告
        run: python tools/ci_assert.py ci-run

      - name: 诊断摘要（无论成败都写进 Step Summary，网页上直接可见）
        if: always()
        shell: pwsh
        run: |
          "## CI 诊断" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path ci-run) {
            Get-ChildItem ci-run -Recurse | ForEach-Object {
              "{0}  {1} B" -f $_.FullName.Replace((Get-Location).Path + '\', ''), $_.Length
            } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "ci-run 目录不存在" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          python -c "import sqlite3,os;d=os.path.join('ci-run','events.sqlite');print(dict(sqlite3.connect(d).execute('select cat,count(*) from events group by cat')) if os.path.exists(d) else 'no db')" 2>&1 |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 上传本次记录产物（排查失败时很有用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-run
          path: ci-run
          if-no-files-found: ignore
